name: 비차익 프로그램 매매 자동 수집

on:
  schedule:
    # 장중 09:00~15:30 KST = UTC 00:00~06:30, 30분 간격 (평일만)
    - cron: '0,30 0,1,2,3,4,5,6 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 비차익 프로그램 매매 수집 (KRX 직접 조회 - 토큰 발급 없음)
        run: python market-app/scripts/collect-program-trading.py

      - name: 변경사항 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market-app/data/program-trading.json
          git diff --staged --quiet || git commit -m "비차익 프로그램 매매 업데이트 $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
