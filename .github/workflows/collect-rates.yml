name: 금리·환율 자동 수집

on:
  schedule:
    # 평일 오전 7시 KST (= UTC 22:00 전날) + 오후 11시 KST (= UTC 14:00)
    - cron: '0 22 * * 0-4'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 금리·환율 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node market-app/scripts/collect-rates.js

      - name: 변경사항 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market-app/data/rates.json
          git diff --staged --quiet || git commit -m "금리·환율 업데이트 $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
