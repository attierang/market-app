name: 외국인/기관 순매수 상위 수집

on:
  schedule:
    - cron: '0 7 * * 1-5'    # 장 마감 후 KST 16:00
    - cron: '0 3,5 * * 1-5'  # 장중 KST 12:00, 14:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: KIS 토큰 캐시 복원 (새 발급 없이 재사용만)
        uses: actions/cache@v4
        with:
          path: market-app/data/kis-real-token.json
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: 외국인/기관 순매수·순매도 수집 (캐시토큰 재사용, 없으면 네이버)
        env:
          KIS_REAL_APP_KEY:    ${{ secrets.KIS_REAL_APP_KEY }}
          KIS_REAL_APP_SECRET: ${{ secrets.KIS_REAL_APP_SECRET }}
        run: node market-app/scripts/collect-investor-rank.js

      - name: 변경사항 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market-app/data/krx-netbuy.json
          git diff --staged --quiet || git commit -m "외국인/기관 순매수 업데이트 $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
