name: 외국인/기관 순매수 상위 수집

on:
  schedule:
    - cron: '0 7 * * 1-5'    # 장 마감 후 KST 16:00
    - cron: '0 3,5 * * 1-5'  # 장중 KST 12:00, 14:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 외국인/기관 순매수 수집 (네이버금융, KIS 미사용)
        run: node market-app/scripts/collect-investor-rank.js

      - name: 변경사항 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market-app/data/krx-netbuy.json
          git diff --staged --quiet || git commit -m "외국인/기관 순매수 업데이트 $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
