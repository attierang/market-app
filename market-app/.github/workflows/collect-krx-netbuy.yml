name: KRX 종목별 순매수 상위 20 수집

on:
  schedule:
    # 장 마감 후 KST 16:00 = UTC 07:00, 평일
    - cron: '0 7 * * 1-5'
    # 장중 업데이트: KST 12:00, 14:00 = UTC 03:00, 05:00
    - cron: '0 3,5 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: requests 설치
        run: pip install requests

      - name: KRX 종목별 순매수 수집
        run: python market-app/scripts/collect-krx-netbuy.py

      - name: 변경사항 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market-app/data/krx-netbuy.json
          git diff --staged --quiet || git commit -m "KRX 순매수 상위20 업데이트 $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
